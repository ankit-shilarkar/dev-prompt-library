name: Refresh prompt snapshot

# Exports the prompts table to data/prompts.json so pages load from the GitHub Pages CDN
# even when Supabase is slow or paused. The daily request also counts as project activity.
on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/prompt-snapshot.yml"]

permissions:
  contents: write

concurrency:
  group: prompt-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://npqnunamefcptmmozuxj.supabase.co
      # Publishable key, already public in the site's JavaScript. Read-only via RLS.
      SUPABASE_KEY: sb_publishable_9PQubkBh3qortx9xGgE20A_-BricY1j
      COLUMNS: id,title,category,category_slug,purpose,icon,tag_label,tag_class,source,source_url,purpose_note,preview,prompt_text,chapter,examples
    steps:
      - uses: actions/checkout@v4

      - name: Export prompts
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/prompts?select=$COLUMNS&order=id" \
            -H "apikey: $SUPABASE_KEY" -o rows.json
          jq -e 'type == "array" and length > 0' rows.json > /dev/null

      - name: Update snapshot if prompts changed
        id: update
        run: |
          mkdir -p data
          if [ -f data/prompts.json ] && jq -e --slurpfile fresh rows.json '.rows == $fresh[0]' data/prompts.json > /dev/null; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            jq '{generated_at: (now | todate), count: length, rows: .}' rows.json > data/prompts.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit snapshot
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prompts.json
          git commit -m "Refresh prompt snapshot ($(jq .count data/prompts.json) prompts)"
          git push
